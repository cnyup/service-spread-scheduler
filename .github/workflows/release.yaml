# Release pipeline: build and push multi-arch images to ghcr.io on tags.
#
# Contract:
# - Trigger: pushing a tag `v*` (e.g. v0.1.0, v0.1.0-alpha.1).
# - Produces: ghcr.io/cnyup/service-spread-scheduler/{scheduler,webhook}:<tag>
#   plus a floating :latest (kind e2e flows rely on :latest being current).
# - Auth: GITHUB_TOKEN with packages:write permission — no PAT needed.
# - Images mirror build/Dockerfile.{scheduler,webhook} (golang:1.22 build,
#  debian:bookworm-slim runtime, GOPROXY=goproxy.cn for reachability).
# - After a release, update deployments with the pinned tag instead of
#  :latest (see config/manager/*.yaml notes).
#
# Optional ACR mirror (mainland distribution): ghcr.io is unreachable from
# many mainland clusters (verified 2026-09-28 on an ACK Beijing cluster:
# pulls hang indefinitely with no error event). The push-acr job below
# re-pushes the same images to a personal Aliyun ACR instance so mainland
# nodes pull over the VPC endpoint instead. Disabled unless ALL of:
#   vars.ENABLE_ACR == 'true', secrets.ACR_REGISTRY, ACR_NAMESPACE,
#   ACR_USERNAME, ACR_PASSWORD.
# Registry form: <instance>-registry.cn-<region>.cr.aliyuncs.com (personal
# edition). Clusters in the same region should pull from the -vpc variant.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push scheduler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.scheduler
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cnyup/service-spread-scheduler/scheduler:${{ github.ref_name }}
            ghcr.io/cnyup/service-spread-scheduler/scheduler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push webhook image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.webhook
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cnyup/service-spread-scheduler/webhook:${{ github.ref_name }}
            ghcr.io/cnyup/service-spread-scheduler/webhook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Helm chart to gh-pages
        run: |
          set -euo pipefail
          curl -sSL https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          CHART_VERSION=$(awk '/^version:/{print $2}' charts/service-spread-scheduler/Chart.yaml)
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git fetch origin gh-pages || true
          mkdir -p /tmp/repo && cd /tmp/repo
          git clone -q --branch gh-pages ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git . 2>/dev/null || git init -q && git remote add origin ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git || true
          cp -r ${GITHUB_WORKSPACE}/charts/service-spread-scheduler /tmp/src-chart
          helm package /tmp/src-chart -d .
          helm repo index . --url https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY##*/}
          git add -A && git commit -qm "chart ${CHART_VERSION} for ${GITHUB_REF_NAME}" || echo "no chart change"
          git push -q origin HEAD:gh-pages

  # Docker Hub mirror (public, anonymous pull): the zero-config install
  # path. Gated on DOCKERHUB_TOKEN existing; skipped otherwise.
  push-dockerhub:
    runs-on: ubuntu-latest
    needs: release
    if: vars.ENABLE_DOCKERHUB == 'true' && secrets.DOCKERHUB_TOKEN != ''
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER || 'bcyup' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror images
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "ghcr.io/cnyup/service-spread-scheduler/scheduler:${TAG}"
          docker tag  "ghcr.io/cnyup/service-spread-scheduler/scheduler:${TAG}" "bcyup/service-spread-scheduler:${TAG}"
          docker push "bcyup/service-spread-scheduler:${TAG}"
          docker pull --platform linux/amd64 "ghcr.io/cnyup/service-spread-scheduler/webhook:${TAG}"
          docker tag  "ghcr.io/cnyup/service-spread-scheduler/webhook:${TAG}" "bcyup/service-spread-webhook:${TAG}"
          docker push "bcyup/service-spread-webhook:${TAG}"

  # Mainland mirror: pulls the just-pushed ghcr images by digest and re-pushes
  # them to Aliyun ACR. Always scheduled after the ghcr job; the config-check
  # step prints which prerequisite is missing (SET/UNSET, never values) so a
  # silent skip can be diagnosed from the run log directly.
