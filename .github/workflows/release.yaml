# Release pipeline: build and push multi-arch images to ghcr.io on tags.
#
# Contract:
# - Trigger: pushing a tag `v*` (e.g. v0.1.0, v0.1.0-alpha.1).
# - Produces: ghcr.io/cnyup/service-spread-scheduler/{scheduler,webhook}:<tag>
#   plus a floating :latest (kind e2e flows rely on :latest being current).
# - Auth: GITHUB_TOKEN with packages:write permission — no PAT needed.
# - Images mirror build/Dockerfile.{scheduler,webhook} (golang:1.22 build,
#  debian:bookworm-slim runtime, GOPROXY=goproxy.cn for reachability).
# - After a release, update deployments with the pinned tag instead of
#  :latest (see config/manager/*.yaml notes).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push scheduler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.scheduler
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cnyup/service-spread-scheduler/scheduler:${{ github.ref_name }}
            ghcr.io/cnyup/service-spread-scheduler/scheduler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push webhook image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.webhook
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cnyup/service-spread-scheduler/webhook:${{ github.ref_name }}
            ghcr.io/cnyup/service-spread-scheduler/webhook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
