# Release pipeline: build and push multi-arch images to ghcr.io on tags.
#
# Contract:
# - Trigger: pushing a tag `v*` (e.g. v0.1.0, v0.1.0-alpha.1).
# - Produces: ghcr.io/cnyup/service-spread-scheduler/{scheduler,webhook}:<tag>
#   plus a floating :latest (kind e2e flows rely on :latest being current).
# - Auth: GITHUB_TOKEN with packages:write permission — no PAT needed.
# - Images mirror build/Dockerfile.{scheduler,webhook} (golang:1.22 build,
#  debian:bookworm-slim runtime, GOPROXY=goproxy.cn for reachability).
# - After a release, update deployments with the pinned tag instead of
#  :latest (see config/manager/*.yaml notes).
#
# Optional ACR mirror (mainland distribution): ghcr.io is unreachable from
# many mainland clusters (verified 2026-09-28 on an ACK Beijing cluster:
# pulls hang indefinitely with no error event). The push-acr job below
# re-pushes the same images to a personal Aliyun ACR instance so mainland
# nodes pull over the VPC endpoint instead. Disabled unless ALL of:
#   vars.ENABLE_ACR == 'true', secrets.ACR_REGISTRY, ACR_NAMESPACE,
#   ACR_USERNAME, ACR_PASSWORD.
# Registry form: <instance>-registry.cn-<region>.cr.aliyuncs.com (personal
# edition). Clusters in the same region should pull from the -vpc variant.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push scheduler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.scheduler
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cnyup/service-spread-scheduler/scheduler:${{ github.ref_name }}
            ghcr.io/cnyup/service-spread-scheduler/scheduler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push webhook image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.webhook
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cnyup/service-spread-scheduler/webhook:${{ github.ref_name }}
            ghcr.io/cnyup/service-spread-scheduler/webhook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Mainland mirror: pulls the just-pushed ghcr images by digest and re-pushes
  # them to Aliyun ACR. Always scheduled after the ghcr job; the config-check
  # step prints which prerequisite is missing (SET/UNSET, never values) so a
  # silent skip can be diagnosed from the run log directly.
  push-acr:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Config check
        id: cfg
        env:
          ENABLE_ACR: ${{ vars.ENABLE_ACR }}
          HAS_REGISTRY: ${{ secrets.ACR_REGISTRY != '' }}
          HAS_NAMESPACE: ${{ secrets.ACR_NAMESPACE != '' }}
          HAS_USERNAME: ${{ secrets.ACR_USERNAME != '' }}
          HAS_PASSWORD: ${{ secrets.ACR_PASSWORD != '' }}
        run: |
          echo "vars.ENABLE_ACR='${ENABLE_ACR}' (must be exactly 'true')"
          echo "secrets.ACR_REGISTRY: ${HAS_REGISTRY}"
          echo "secrets.ACR_NAMESPACE: ${HAS_NAMESPACE}"
          echo "secrets.ACR_USERNAME: ${HAS_USERNAME}"
          echo "secrets.ACR_PASSWORD: ${HAS_PASSWORD}"
          ok=true
          [ "$ENABLE_ACR" = "true" ] || ok=false
          [ "$HAS_REGISTRY" = "true" ] || ok=false
          [ "$HAS_NAMESPACE" = "true" ] || ok=false
          [ "$HAS_USERNAME" = "true" ] || ok=false
          [ "$HAS_PASSWORD" = "true" ] || ok=false
          echo "configured=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" != "true" ]; then
            echo "::warning::push-acr skipped — fix the UNSET items above (Settings → Secrets and variables → Actions; ENABLE_ACR belongs on the Variables tab, the four ACR_* on the Secrets tab)"
          fi

      - name: Log in to ACR
        if: steps.cfg.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Mirror images to ACR
        if: steps.cfg.outputs.configured == 'true'
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          NS: ${{ secrets.ACR_NAMESPACE }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for img in scheduler webhook; do
            src="ghcr.io/cnyup/service-spread-scheduler/${img}:${TAG}"
            dst="${REGISTRY}/${NS}/${img}:${TAG}"
            docker pull --platform linux/amd64 "$src"   # re-tag single-arch
            docker tag "$src" "$dst"
            docker push "$dst"
            echo "mirrored ${img}: ${src} -> ${dst}"
          done
