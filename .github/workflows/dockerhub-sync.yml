# One-shot Docker Hub publisher (workflow_dispatch only).
# Creates the bcyup/service-spread-scheduler repository via the Hub API
# (with description + GitHub link), mirrors the ghcr images, and verifies
# anonymous pullability. The credentials are inline for this one run and
# MUST be scrubbed after (the next commit removes this file's env block).
name: dockerhub-sync
on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DH_USER: bcyup
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Fail fast without the token
        if: env.DH_TOKEN == ''
        run: |
          cat <<'EOF'
          DOCKERHUB_TOKEN secret is not configured.
          Add it once in Settings → Secrets and variables → Actions
          (value: the dckr_pat_... token), then re-run this workflow.
          EOF
          exit 1

      - name: Mirror images (push auto-creates the public repository)
        run: |
          set -euo pipefail
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
          TAG="${TAG_OVERRIDE:-v0.1.1}"
          for img in scheduler webhook; do
            docker pull --platform linux/amd64 "ghcr.io/cnyup/service-spread-scheduler/${img}:${TAG}"
            docker tag  "ghcr.io/cnyup/service-spread-scheduler/${img}:${TAG}" "bcyup/service-spread-scheduler-${img}:${TAG}"
            docker push "bcyup/service-spread-scheduler-${img}:${TAG}"
          done

      - name: Login and mirror images
        run: |
          set -euo pipefail
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
          TAG="${TAG_OVERRIDE:-v0.1.1}"
          for img in scheduler webhook; do
            docker pull --platform linux/amd64 "ghcr.io/cnyup/service-spread-scheduler/${img}:${TAG}"
            docker tag  "ghcr.io/cnyup/service-spread-scheduler/${img}:${TAG}" "bcyup/service-spread-scheduler-${img}:${TAG}"
            docker push "bcyup/service-spread-scheduler-${img}:${TAG}"
          done

      - name: Verify anonymous pull
        run: |
          set -euo pipefail
          TAG="${TAG_OVERRIDE:-v0.1.1}"
          docker logout
          TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:bcyup/service-spread-scheduler-scheduler:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://registry-1.docker.io/v2/bcyup/service-spread-scheduler-scheduler/manifests/${TAG}")
          echo "anon-manifest http=$code"
          [ "$code" = "200" ] || exit 1
