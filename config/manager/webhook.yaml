---
# Deployment of the ServiceSpreadPolicy validating webhook (M1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-spread-webhook
  namespace: service-spread-system
  labels:
    app: service-spread-webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-spread-webhook
  template:
    metadata:
      labels:
        app: service-spread-webhook
    spec:
      serviceAccountName: service-spread-webhook
      containers:
        - name: webhook
          image: ghcr.io/cnyup/service-spread-scheduler/webhook:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config-map-namespace=service-spread-system
            - --config-map-name=service-spread-scheduler-config
            - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            # KEDA-style self-signed certificates: the leader replica
            # generates/rotates the serving cert in-process and patches the
            # caBundle. cert-manager (config/webhook/certificates.yaml) is
            # NOT required with this mode; if both are present, whoever
            # writes the Secret last wins — pick one.
            - --leader-elect
            - --self-sign-certs
          env:
            - name: WEBHOOK_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: webhook
              containerPort: 9443
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz/shared-config
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: serving-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: serving-cert
          secret:
            secretName: service-spread-webhook-serving-cert
            # optional: on a cold cluster the Secret is created by the
            # in-process self-sign rotator AFTER the pod starts (the
            # chicken-and-egg of self-issued certs); with optional=false
            # the container never starts and the rotator never runs
            # (verified on kind 2026-09-29). kubelet keeps retrying the
            # mount and picks the Secret up once issued; the process
            # exits before that (see main.go) and the restart lands on a
            # fully-mounted volume.
            optional: true
---
# PDB: keep one webhook serving during node drains — policy admission is
# fail-closed, losing ALL webhook pods blocks ServiceSpreadPolicy writes
# (existing scheduling keeps working, see chaos drill c4).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: service-spread-webhook
  namespace: service-spread-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: service-spread-webhook
