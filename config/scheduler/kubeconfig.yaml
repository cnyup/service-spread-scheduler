---
# Example KubeSchedulerConfiguration for the ServiceSpread scheduler profile.
#
# M1 STATUS — NOT YET LOADABLE: the ServiceSpread plugin is first registered
# in the M3 binary. Running the M1 scaffolding binary with this config fails
# at profile validation (unknown plugin "ServiceSpread"). It is shipped now
# because it is the canonical reference for args and profile shape
# (design doc 3.1/12.1).
#
# Notes:
# - multiPoint.enable registers ServiceSpread at every extension point it
#   implements, ordered after the native plugins at each point.
# - DefaultPreemption is disabled for this profile (design doc 8.4): default
#   preemption could evict same-service pods.
# - leaderElection MUST be identical (same Lease name+namespace) across ALL
#   replicas of this scheduler (design doc 3.1); a second deployment using
#   the same schedulerName with a different Lease would break the in-process
#   reservation accounting.
# - The NodeAffinity plugin MUST NOT be given addedAffinity in this profile:
#   out-of-tree code cannot read other plugins' pluginConfig, so v1 forbids
#   it instead of hashing it (dev-design §5.4/§9-8).
apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
leaderElection:
  leaderElect: true
  resourceLock: leases
  resourceNamespace: service-spread-system
  resourceName: service-spread-scheduler
profiles:
  - schedulerName: service-spread-scheduler
    plugins:
      multiPoint:
        enabled:
          - name: ServiceSpread
      postFilter:
        disabled:
          - name: DefaultPreemption
    pluginConfig:
      - name: ServiceSpread
        args:
          # apiVersion/kind are optional; DecodeServiceSpreadArgs defaults
          # them to config.scheduling.soyup.top/v1alpha1 ServiceSpreadArgs.
          serviceLabelKey: app.kubernetes.io/name
          requirePolicy: true
          managedSchedulerName: service-spread-scheduler
          fallbackCacheTTL: 10m
          reservationTTL: 5m
          reconcilePeriod: 10m
