---
# Service fronting the ServiceSpreadPolicy validating webhook.
#
# Split from the cert-manager Issuer/Certificate manifests (certificates.yaml)
# so e2e environments without cert-manager can apply just this Service.
apiVersion: v1
kind: Service
metadata:
  name: service-spread-webhook-service
  namespace: service-spread-system
spec:
  selector:
    app: service-spread-webhook
  ports:
    - name: https
      port: 443
      targetPort: 9443
