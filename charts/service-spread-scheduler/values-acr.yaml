# Mainland (ACK) values — ACR personal edition.
# Verified facts baked in (2026-09-28, ACK Beijing):
#   - ghcr.io pulls hang indefinitely from mainland nodes; ACR works.
#   - Personal-edition "public" repos are NOT anonymously pullable:
#     an imagePullSecret is ALWAYS required.
#   - Personal edition has no -vpc endpoints; cross-region goes over the
#     public endpoint of the region hosting the registry.
global:
  namespace: service-spread-system
  schedulerName: service-spread-scheduler
  serviceLabelKey: app.kubernetes.io/name

scheduler:
  image:
    registry: registry.cn-hangzhou.aliyuncs.com/cnyup
    repository: scheduler
    tag: ""            # Chart.appVersion
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: acr-regcred   # create in the release namespace first

webhook:
  image:
    registry: registry.cn-hangzhou.aliyuncs.com/cnyup
    repository: webhook
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: acr-regcred

prometheusRule:
  enabled: true
  labels:
    prometheus: k8s       # ACK ruleSelector (adjust to your instance)
  namespace: monitoring   # operator watches its own ns only (nil selector)
