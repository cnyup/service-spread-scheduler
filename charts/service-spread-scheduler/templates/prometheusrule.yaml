{{/*
Optional PrometheusRule (4 alerts). Rendered INLINE (not via files/ + tpl):
the alert annotations use Prometheus's own {{ $labels.* }} templating,
which Go's text/template would try to execute — only the metadata is
templated, the spec stays literal.

Labels MUST match the target Prometheus ruleSelector, and with a nil
ruleNamespaceSelector the rule must live in the operator's own namespace
(both verified live on ACK 2026-09-28: monitoring ns + prometheus: k8s
loaded 4/4). Source-of-truth for the spec: config/monitoring/prometheusrule.yaml
(sync asserted by hack/verify-chart.sh).
*/}}
{{- define "service-spread-scheduler.promRuleNamespace" -}}
{{- .Values.prometheusRule.namespace | default .Values.global.namespace -}}
{{- end -}}
{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: service-spread-scheduler
  namespace: {{ include "service-spread-scheduler.promRuleNamespace" . }}
  labels:
    app: service-spread-scheduler
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: service-spread-scheduler.rules
      rules:
        # §10.3/§12.2 — HPA ceiling exceeds the eligible-node union capacity.
        - alert: ServiceSpreadCapacityDeficit
          expr: max by (namespace, service) (service_spread_capacity_deficit) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Service {{`{{ $labels.namespace }}`}}/{{`{{ $labels.service }}`}} cannot host its HPA ceiling"
            description: >-
              service_spread_capacity_deficit is {{`{{ $value }}`}} for
              {{`{{ $labels.namespace }}`}}/{{`{{ $labels.service }}`}}:
              HPA maxReplicas exceeds serviceEligibleNodeCount x
              maxPodsPerNode. Scaling to the HPA ceiling will leave pods Pending.

        # §10.3/§12.1 — replica-target reads degraded (fallback/last-good).
        - alert: ServiceSpreadReplicaTargetFallback
          expr: max by (namespace, service, domain) (service_spread_fallback_active) == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Replica target fallback active for {{`{{ $labels.namespace }}`}}/{{`{{ $labels.service }}`}}"
            description: >-
              service_spread_fallback_active has been 1 for 10m on
              {{`{{ $labels.namespace }}`}}/{{`{{ $labels.service }}`}}
              (domain {{`{{ $labels.domain }}`}}): HPA/KEDA/deployment reads
              are failing and the reported replica target is a fallback or
              last-good value.

        # §10.3 — sustained placement rejections (all nodes at cap).
        - alert: ServiceSpreadFilterRejectionRate
          expr: sum by (reason) (rate(service_spread_filter_rejections_total[5m])) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High ServiceSpread filter rejection rate (reason={{`{{ $labels.reason }}`}})"
            description: >-
              sum by (reason) rate(service_spread_filter_rejections_total[5m])
              is {{`{{ $value }}`}}/s over 10m for reason
              {{`{{ $labels.reason }}`}}: placement is being rejected
              repeatedly, e.g. all nodes at maxPodsPerNode.

        # §10.3/§12.1 — observer data totally absent (metrics endpoint or loop down).
        # With 2 replicas this fires only on TOTAL loss; a single dead replica
        # is masked by the healthy one.
        - alert: ServiceSpreadObserverMetricsStale
          expr: absent(service_spread_replica_target)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "ServiceSpread observer metrics are absent"
            description: >-
              service_spread_replica_target has been missing for 10m: the
              scheduler metrics endpoint is down or the observation loop has
              stopped. Replica-target and capacity visibility are lost.
{{- end }}
